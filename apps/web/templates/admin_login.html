{% extends "base.html" %}
{% block body %}
<section class="card">
  <h2>管理员后台登录</h2>
  <p class="muted">
    需要具备用户或权限管理权限。当前 CSP 状态：
    <strong>{{ "运行中" if csp_running else "未运行" }}</strong>
  </p>
  <form method="post" action="{{ url_for('admin_login') }}" class="grid2">
    <label>用户名
      <input type="text" name="username" value="admin" required>
    </label>
    <label>密码
      <input type="password" name="password" value="admin123" required>
    </label>
    <div class="form-actions">
      <button type="submit">登录后台</button>
    </div>
  </form>
</section>
{% endblock %}
